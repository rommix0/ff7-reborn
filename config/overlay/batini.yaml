# splat config for BATTLE/BATINI.X, the battle's setup, run at 0x801B0000 straight after BATTLE.X is read.
# The disc's file is packed; this is it unpacked (BATINI.X.dec). Started from tools/module_yaml.py's.
name: BATINI.X
sha1: 2771b06f7249d34ed8a4f8c94e6047f70278e17c
options:
  basename: batini
  target_path: disks/BATTLE/BATINI.X.dec
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/overlay/batini
  src_path: src/overlay
  build_path: build
  ld_script_path: build/overlay/batini.ld
  undefined_funcs_auto_path: build/overlay/batini_undefined_funcs_auto.txt
  undefined_syms_auto_path: build/overlay/batini_undefined_syms_auto.txt
  symbol_addrs_path:
    - config/symbols.main.txt
    - config/symbols.main.psyq.txt
    - config/symbols.batini.txt

  find_file_boundaries: False
  gp_value: 0x80062D44
  o_as_suffix: True
  use_legacy_include_asm: False
  generate_asm_macros_files: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 2
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: batini
    type: code
    start: 0
    vram: 0x801B0000
    subsegments:
      - [0x0, .rodata, batini]
      - [0x50, c, batini]
  - [0x27B4]
