# splat config for MINI/SNOBO.BIN, the snowboard down to the Great Glacier, run at 0x800A0000 in the field's place. The disc's file is
# packed; this is it unpacked (SNOBO.BIN.dec). Started from tools/module_yaml.py's.
name: SNOBO.BIN
sha1: 9d768ea6714c31fc1560760bf12d07d45084b501
options:
  basename: snobo
  target_path: disks/MINI/SNOBO.BIN.dec
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/overlay/snobo
  src_path: src/overlay
  build_path: build
  ld_script_path: build/overlay/snobo.ld
  undefined_funcs_auto_path: build/overlay/snobo_undefined_funcs_auto.txt
  undefined_syms_auto_path: build/overlay/snobo_undefined_syms_auto.txt
  symbol_addrs_path:
    - config/symbols.main.txt
    - config/symbols.main.psyq.txt
    - config/symbols.snobo.txt

  find_file_boundaries: False
  gp_value: 0x80062D44
  o_as_suffix: True
  use_legacy_include_asm: False
  generate_asm_macros_files: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: snobo
    type: code
    start: 0
    vram: 0x800A0000
    subsegments:
      - [0x0, rodata]
      - [0x390, c, snobo]
      - [0x1FD74, data]
  - [0x3D690]
