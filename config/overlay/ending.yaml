# splat config for FIELD/ENDING.X, the boot's logos and opening credits, loaded at 0x800A0000. Started from
# tools/module_yaml.py's.
name: ENDING.X
sha1: 1b3fbf999913024209b23a1bb8a6874a66fc19ba
options:
  basename: ending
  target_path: disks/FIELD/ENDING.X
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/overlay/ending
  src_path: src/overlay
  build_path: build
  ld_script_path: build/overlay/ending.ld
  undefined_funcs_auto_path: build/overlay/ending_undefined_funcs_auto.txt
  undefined_syms_auto_path: build/overlay/ending_undefined_syms_auto.txt
  symbol_addrs_path:
    - config/symbols.main.txt
    - config/symbols.main.psyq.txt
    - config/symbols.ending.txt

  find_file_boundaries: False
  gp_value: 0x80062D44
  o_as_suffix: True
  use_legacy_include_asm: False
  generate_asm_macros_files: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: ending
    type: code
    start: 0
    vram: 0x800A0000
    subsegments:
      - [0x0, .rodata, ending]
      - [0x30, c, ending]
      - [0x3934, data]
  - [0xF414]
