# splat config for MINI/CHOCOBO.BIN, the chocobo race, run at 0x800A0000 in the field's place. The disc's file is
# packed; this is it unpacked (CHOCOBO.BIN.dec). Started from tools/module_yaml.py's.
name: CHOCOBO.BIN
sha1: d5ada4f6281dcaec86005dd4429a1f18240f752a
options:
  basename: chocobo
  target_path: disks/MINI/CHOCOBO.BIN.dec
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/overlay/chocobo
  src_path: src/overlay
  build_path: build
  ld_script_path: build/overlay/chocobo.ld
  undefined_funcs_auto_path: build/overlay/chocobo_undefined_funcs_auto.txt
  undefined_syms_auto_path: build/overlay/chocobo_undefined_syms_auto.txt
  symbol_addrs_path:
    - config/symbols.main.txt
    - config/symbols.main.psyq.txt
    - config/symbols.chocobo.txt

  find_file_boundaries: False
  gp_value: 0x80062D44
  o_as_suffix: True
  use_legacy_include_asm: False
  generate_asm_macros_files: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: chocobo
    type: code
    start: 0
    vram: 0x800A0000
    subsegments:
      - [0x0, .rodata, chocobo]
      - [0x18, .rodata, chocobo_init]
      - [0x34, .rodata, chocobo_race]
      - [0x2D0, c, chocobo]
      - [0x1630, c, chocobo_init]
      - [0x2984, c, chocobo_race]
      - [0xD91C, c, chocobo_figure]
      - [0x11250, data]
  - [0x1733C]
