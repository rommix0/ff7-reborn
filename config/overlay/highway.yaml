# splat config for MINI/HIGHWAY.BIN, the motorcycle chase, run at 0x800A0000 in the field's place. The disc's file is
# packed; this is it unpacked (HIGHWAY.BIN.dec). Started from tools/module_yaml.py's.
name: HIGHWAY.BIN
sha1: bc0d4793380d2aa5715e971befb49add8ef7829a
options:
  basename: highway
  target_path: disks/MINI/HIGHWAY.BIN.dec
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/overlay/highway
  src_path: src/overlay
  build_path: build
  ld_script_path: build/overlay/highway.ld
  undefined_funcs_auto_path: build/overlay/highway_undefined_funcs_auto.txt
  undefined_syms_auto_path: build/overlay/highway_undefined_syms_auto.txt
  symbol_addrs_path:
    - config/symbols.main.txt
    - config/symbols.main.psyq.txt
    - config/symbols.highway.txt

  find_file_boundaries: False
  gp_value: 0x80062D44
  o_as_suffix: True
  use_legacy_include_asm: False
  generate_asm_macros_files: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: highway
    type: code
    start: 0
    vram: 0x800A0000
    subsegments:
      - [0x0, .rodata, highway]
      - [0xD0, c, highway]
      - [0x141C8, data]
  - [0x14F4C]
