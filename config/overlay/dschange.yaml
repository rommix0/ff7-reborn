# splat config for FIELD/DSCHANGE.X, the disc change and game over screens, loaded at 0x800A0000. Started from
# tools/module_yaml.py's.
name: DSCHANGE.X
sha1: e884441c5ceacdeb94e16a603b73ca53706078e8
options:
  basename: dschange
  target_path: disks/FIELD/DSCHANGE.X
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/overlay/dschange
  src_path: src/overlay
  build_path: build
  ld_script_path: build/overlay/dschange.ld
  undefined_funcs_auto_path: build/overlay/dschange_undefined_funcs_auto.txt
  undefined_syms_auto_path: build/overlay/dschange_undefined_syms_auto.txt
  symbol_addrs_path:
    - config/symbols.main.txt
    - config/symbols.main.psyq.txt
    - config/symbols.dschange.txt

  find_file_boundaries: False
  gp_value: 0x80062D44
  o_as_suffix: True
  use_legacy_include_asm: False
  generate_asm_macros_files: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 2
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: dschange
    type: code
    start: 0
    vram: 0x800A0000
    subsegments:
      - [0x0, c, dschange]
      - [0x1580, data]
  - [0x1774]
