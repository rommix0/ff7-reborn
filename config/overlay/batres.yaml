# splat config for BATTLE/BATRES.X, the battle's results, run at 0x801B0000 when BATTLE.X ends a battle.
# The disc's file is packed; this is it unpacked (BATRES.X.dec). Started from tools/module_yaml.py's.
name: BATRES.X
sha1: e7ae9182df1c8ee457bae5bf7d7dc63c61a8c3d8
options:
  basename: batres
  target_path: disks/BATTLE/BATRES.X.dec
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/overlay/batres
  src_path: src/overlay
  build_path: build
  ld_script_path: build/overlay/batres.ld
  undefined_funcs_auto_path: build/overlay/batres_undefined_funcs_auto.txt
  undefined_syms_auto_path: build/overlay/batres_undefined_syms_auto.txt
  symbol_addrs_path:
    - config/symbols.main.txt
    - config/symbols.main.psyq.txt
    - config/symbols.batres.txt

  find_file_boundaries: False
  gp_value: 0x80062D44
  o_as_suffix: True
  use_legacy_include_asm: False
  generate_asm_macros_files: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 2
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: batres
    type: code
    start: 0
    vram: 0x801B0000
    subsegments:
      - [0x0, c, batres]
  - [0x193C]
