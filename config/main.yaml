# splat config for the main exe. Started from `splat create_config` on the retail SCUS_941.63, then corrected by hand.
name: SCUS_941.63
sha1: a95e8b16b97071203b953bb81a33980509262f30
options:
  basename: main
  target_path: disks/SCUS_941.63
  elf_path: build/main.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm
  src_path: src
  build_path: build
  ld_script_path: build/main.ld
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  symbol_addrs_path:
    - config/symbols.main.txt
    - config/symbols.main.psyq.txt

  find_file_boundaries: False
  gp_value: 0x80062D44
  o_as_suffix: True
  use_legacy_include_asm: False
  # include/include_asm.h and the .inc files are ours now (include_asm.h has the NATIVE guard): don't regenerate.
  generate_asm_macros_files: False
  section_order: [".rodata", ".text", ".data", ".bss"]

  subalign: 2
  # The retail link packs sections back to back (code starts at the unaligned 0x800110B8).
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    subsegments:
      - [0x800, .rodata, main/main] # main.c's switch tables and strings
      - [0x900, rodata, 900] # text.c's tables, kept as data
      - [0x938, .rodata, main/text] # text_expand's switch table
      - [0x958, .rodata, main/materia] # its switch tables
      - [0xA1C, rodata, A1C] # from the pad after materia.c's last table
      - [0xA20, .rodata, main/materia_own] # its switch tables
      - [0xA9C, rodata, A9C] # magic_order.c's table, kept as data
      - [0xAB4, .rodata, main/pad] # the demo script's switch table
      - [0xB00, .rodata, main/text_draw] # the text renderer's switch table
      - [0xB14, rodata, B14]
      - [0xB94, .rodata, main/sound] # seq_look_ahead's switch table
      - [0xC38, .rodata, main/cd] # a switch table and the disc info file's name
      - [0xC9C, .rodata, main/movie] # the movie table's file name
      - [0xCB4, rodata, CB4]
      # splat guessed 0x18AC, but 0x18AC-0x18B7 is the string " (%08x)\n".
      - [0x18B8, asm, 18B8]
      - [0x197C, c, main/main] # the game's boot and main loop; before it, the hand-written entry code
      - [0x449C, c, main/transition] # a screen transition: GCC 2.7.2 and ASPSX 2.34 like the loader, but -G0
      - [0x4CD8, c, main/loader] # disc reads and module starts: ASPSX 2.34, unlike main.c
      - [0x5200, c, main/bitops]
      - [0x5284, c, main/random] # -G8 and ASPSX 2.34, like the loader before it
      - [0x5470, c, main/text] # -G8 and ASPSX 2.34 again
      - [0x5DA4, c, main/battle] # -G8, ASPSX 2.34, and --expand-div for its division
      - [0x6344, c, main/inflate] # -G8 and ASPSX 2.34
      - [0x7A38, c, main/materia_ap] # GCC 2.6.3, ASPSX 2.21, -G8
      - [0x806C, c, main/materia] # GCC 2.6.3, ASPSX 2.21, -G8
      - [0x9FB8, c, main/materia_own] # GCC 2.6.3, ASPSX 2.21, -G8
      - [0xB49C, c, main/member_build] # GCC 2.6.3, ASPSX 2.21, -G8
      - [0xC8EC, c, main/magic_order] # GCC 2.7.2, ASPSX 2.34, -G8
      - [0xCBCC, asm, CBCC] # hand-written: a word-at-a-time copy
      - [0xCC34, c, main/pad] # GCC 2.7.2, ASPSX 2.21, -G8
      - [0xD5A4, c, main/menu_prims] # GCC 2.7.2, ASPSX 2.21, -G8
      - [0xDEA8, c, main/text_draw] # GCC 2.7.2, ASPSX 2.21, -G8, --expand-div
      - [0x10228, asm, 10228]
      # The AKAO sound driver, 0x800293D0-0x80033A90 (docs/knowledge_base.md §4).
      - [0x19BD0, c, main/sound_init] # compiled with -G8: small globals through $gp
      - [0x1A250, c, main/sound]
      # The game's CD layer: reads by sector, the disc check, the error retries.
      - [0x24290, c, main/cd]
      # Hand-written: an LZS decoder that runs while a read streams in.
      - [0x254F0, asm, 254F0]
      # The movie player: streams STR movies through the MDEC.
      - [0x2573C, c, main/movie]
      # Hand-written again (two data words, then an unreferenced helper), then libspu.
      - [0x26A3C, asm, 26A3C]
      - [0x394FC, data, 394FC] # starts with the sound files' disc table
  - [0x61000]
