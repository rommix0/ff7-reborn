# splat config for the main exe. Started from `splat create_config` on the retail SCUS_941.63, then corrected by hand.
name: SCUS_941.63
sha1: a95e8b16b97071203b953bb81a33980509262f30
options:
  basename: main
  target_path: disks/SCUS_941.63
  elf_path: build/main.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm
  src_path: src
  build_path: build
  ld_script_path: build/main.ld
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  symbol_addrs_path:
    - config/symbols.main.txt
    - config/symbols.main.psyq.txt

  find_file_boundaries: False
  gp_value: 0x80062D44
  o_as_suffix: True
  use_legacy_include_asm: False
  # include/include_asm.h and the .inc files are ours now (include_asm.h has the NATIVE guard): don't regenerate.
  generate_asm_macros_files: False
  section_order: [".rodata", ".text", ".data", ".bss"]

  subalign: 2
  # The retail link packs sections back to back (code starts at the unaligned 0x800110B8).
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    subsegments:
      - [0x800, .rodata, main/main] # main.c's switch tables and strings
      - [0x900, rodata, 900]
      - [0xB94, .rodata, main/sound] # seq_look_ahead's switch table
      - [0xC38, .rodata, main/cd] # a switch table and the disc info file's name
      - [0xC9C, rodata, C9C]
      # splat guessed 0x18AC, but 0x18AC-0x18B7 is the string " (%08x)\n".
      - [0x18B8, asm, 18B8]
      - [0x197C, c, main/main] # the game's boot and main loop; before it, the hand-written entry code
      - [0x449C, c, main/transition] # a screen transition: GCC 2.7.2 and ASPSX 2.34 like the loader, but -G0
      - [0x4CD8, c, main/loader] # disc reads and module starts: ASPSX 2.34, unlike main.c
      - [0x5200, c, main/bitops]
      - [0x5284, asm, 5284]
      # The AKAO sound driver, 0x800293D0-0x80033A90 (docs/knowledge_base.md §4).
      - [0x19BD0, c, main/sound_init] # compiled with -G8: small globals through $gp
      - [0x1A250, c, main/sound]
      # The game's CD layer: reads by sector, the disc check, the error retries.
      - [0x24290, c, main/cd]
      # Hand-written: an LZS decoder that runs while a read streams in. Then the movie player.
      - [0x254F0, asm, 254F0]
      - [0x394FC, data, 394FC] # starts with the sound files' disc table
  - [0x61000]
