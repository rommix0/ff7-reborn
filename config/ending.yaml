# splat config for FIELD/ENDING.X, a module the boot exe reads to 0x800A0000 (the same on all three discs). Only the
# PC port uses it: tools/recomp.py takes its functions, jump tables and code pointers from the asm. Calls into the exe
# take their names from the exe's symbol files.
name: ENDING.X
sha1: 1b3fbf999913024209b23a1bb8a6874a66fc19ba
options:
  basename: ending
  target_path: disks/ENDING.X
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/ending
  src_path: src/ending
  build_path: build/ending
  ld_script_path: build/ending.ld
  undefined_funcs_auto_path: build/ending_undefined_funcs_auto.txt
  undefined_syms_auto_path: build/ending_undefined_syms_auto.txt
  symbol_addrs_path:
    - config/symbols.main.txt
    - config/symbols.main.psyq.txt

  find_file_boundaries: False
  gp_value: 0x80062D44
  o_as_suffix: True
  use_legacy_include_asm: False
  generate_asm_macros_files: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: ending
    type: code
    start: 0
    vram: 0x800A0000
    subsegments:
      - [0, rodata]
      - [0x30, asm] # code runs to the last function's jr $ra at 0x800A392C
      - [0x3934, data]
  - [0xF414]
